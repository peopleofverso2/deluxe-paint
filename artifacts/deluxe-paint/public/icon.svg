<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deluxe Paint · People of Verso — pixel brush app icon -->
  <rect width="64" height="64" rx="12" fill="#191919"/>
  <!-- pixel paintbrush, drawn on an 8px grid -->
  <!-- handle (diagonal, cream) -->
  <rect x="40" y="8"  width="8" height="8" fill="#E8DDD0"/>
  <rect x="36" y="14" width="8" height="8" fill="#E8DDD0"/>
  <rect x="32" y="20" width="8" height="8" fill="#E8DDD0"/>
  <!-- ferrule -->
  <rect x="26" y="26" width="10" height="8" fill="#8A8A8A"/>
  <!-- bristles (burgundy accent) -->
  <rect x="18" y="32" width="12" height="10" fill="#C04849"/>
  <rect x="14" y="38" width="10" height="8" fill="#C04849"/>
  <!-- paint drip pixels -->
  <rect x="12" y="48" width="6" height="6" fill="#C04849"/>
  <rect x="22" y="46" width="4" height="4" fill="#E2231A"/>
  <!-- canvas pixels bottom-right (Amiga palette nod) -->
  <rect x="40" y="44" width="6" height="6" fill="#FFD500"/>
  <rect x="47" y="44" width="6" height="6" fill="#1E4DAC"/>
  <rect x="40" y="51" width="6" height="6" fill="#00CC44"/>
  <rect x="47" y="51" width="6" height="6" fill="#E2231A"/>
</svg>
